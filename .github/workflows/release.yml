name: Release GNOME extension

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release and upload the asset

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Test (pure extension logic — guard before publishing)
        working-directory: linux
        run: node --test

      - name: Inject version-name from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}" # v1.2.0 -> 1.2.0
          # EGO only allows alphanumerics, spaces and dots in version-name,
          # so map anything else (e.g. the hyphen in 1.0.0-rc1) to a dot.
          VERSION_NAME="$(printf '%s' "$VERSION" | sed 's/[^A-Za-z0-9. ]/./g')"
          cd "linux/gnome-extension/ide-toggler@cestoliv.com"
          jq --arg v "$VERSION_NAME" '. + {"version-name": $v}' metadata.json > metadata.tmp
          mv metadata.tmp metadata.json
          echo "version-name set to $VERSION_NAME"

      # Plain zip with metadata.json at the root is exactly what `gnome-extensions
      # pack` produces for an extension with no schemas/po — and what EGO requires.
      - name: Package extension
        run: |
          UUID="ide-toggler@cestoliv.com"
          mkdir -p dist
          ( cd "linux/gnome-extension/$UUID" && zip -qr "$GITHUB_WORKSPACE/dist/$UUID.shell-extension.zip" . )
          unzip -l "dist/$UUID.shell-extension.zip"

      # Uploads via EGO's official REST API with Knox token auth (stdlib only).
      # Skips gracefully if EGO_USERNAME / EGO_PASSWORD are not configured.
      - name: Upload to extensions.gnome.org
        env:
          EGO_USERNAME: ${{ secrets.EGO_USERNAME }}
          EGO_PASSWORD: ${{ secrets.EGO_PASSWORD }}
        run: python3 linux/scripts/upload-to-ego.py "dist/ide-toggler@cestoliv.com.shell-extension.zip"

      - name: Attach zip to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.shell-extension.zip
          generate_release_notes: true
